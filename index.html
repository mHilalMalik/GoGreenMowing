<!DOCTYPE html>
<html lang="en-CA">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1C3A1C" />

  <!--
    Per-route <title>, description, canonical, Open Graph and JSON-LD are
    injected at build time by scripts/prerender.mjs from src/app/seo/routeMeta.ts.
    Do not add them here — the prerenderer strips duplicates and routeMeta is the
    single source of truth.
  -->
  <title>Go Green Mowing | Eco-Friendly Lawn Care – South Surrey, BC</title>
  <meta name="description"
    content="Eco-friendly lawn care across South Surrey, White Rock, Surrey, Delta and Langley. Mowing, aeration, hedge trimming, power washing and seasonal cleanups. Free estimates." />

  <!-- Fonts: preconnect + non-blocking load so they don't gate first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" />
  </noscript>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
