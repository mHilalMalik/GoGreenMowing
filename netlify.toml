[build]
  command = "npm run build"
  publish = "dist"

# Collapse trailing-slash duplicates onto the canonical path.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = false

# Prerendered files exist for every real route and are served before this rule.
# Anything reaching here is genuinely unmatched, so it must return a 404 status
# rather than the old soft-404 that returned 200 for every URL.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
